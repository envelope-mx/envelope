---
# Outbound deliverer (TRD §4 role 4, index/ENVELOPE.md Phase 5) — headless,
# no protocol listener, so readiness/liveness use the metrics endpoint
# (an internal/platform.HeadlessApp instance responding here is as close
# to "this role's background loop is alive" as there is to probe).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: envelope-deliverer
  labels:
    app: envelope
    role: deliverer
spec:
  replicas: 2
  selector:
    matchLabels:
      app: envelope
      role: deliverer
  template:
    metadata:
      labels:
        app: envelope
        role: deliverer
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: "/metrics"
    spec:
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
      containers:
        - name: envelope
          image: envelope:latest
          command: ["/app/envelope", "--roles=deliverer"]
          envFrom:
            - configMapRef: { name: envelope-config }
            - secretRef: { name: envelope-secrets }
          ports:
            - name: metrics
              containerPort: 9090
          readinessProbe:
            httpGet:
              path: /metrics
              port: metrics
          livenessProbe:
            httpGet:
              path: /metrics
              port: metrics
          resources:
            requests: { cpu: 200m, memory: 128Mi }
            limits: { memory: 256Mi }
---
# NFR-AV-1, extended to voluntary disruptions specifically: a node drain
# or rolling update must never be able to take every replica of a role
# down at once. minAvailable: 1 with replicas: 2 means at most one
# replica may be evicted at a time per role.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: envelope-api-pdb
spec:
  minAvailable: 1
  selector:
    matchLabels: { app: envelope, role: api }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: envelope-smtp-inbound-pdb
spec:
  minAvailable: 1
  selector:
    matchLabels: { app: envelope, role: smtp-inbound }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: envelope-smtp-submission-pdb
spec:
  minAvailable: 1
  selector:
    matchLabels: { app: envelope, role: smtp-submission }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: envelope-imap-pdb
spec:
  minAvailable: 1
  selector:
    matchLabels: { app: envelope, role: imap }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: envelope-deliverer-pdb
spec:
  minAvailable: 1
  selector:
    matchLabels: { app: envelope, role: deliverer }
